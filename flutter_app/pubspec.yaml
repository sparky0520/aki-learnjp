name: aki_flutter
description: Aki - Japanese Learning Mobile App (Flutter port of aki-next)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP client
  http: ^1.2.0
  # Shared preferences for local storage
  shared_preferences: ^2.2.2
  # URL launcher for external links
  url_launcher: ^6.2.4
  # Cupertino icons
  cupertino_icons: ^1.0.6
  # Google fonts
  google_fonts: ^6.2.1
  # Flutter SVG for icons
  flutter_svg: ^2.0.10+1
  # Provider for state management
  provider: ^6.1.2
  # Cached network images
  cached_network_image: ^3.3.1
  # Video player (for YouTube embeds)
  youtube_player_flutter: ^9.0.2
  # Markdown rendering
  flutter_markdown: ^0.7.3+1
  # Animations
  animations: ^2.0.11
  # Lottie for animations
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Excalifont
      fonts:
        - asset: assets/fonts/Excalifont-Regular.ttf
